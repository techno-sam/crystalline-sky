[versions]
arch = "3.4-SNAPSHOT"
loom = "1.13.+"
minotaur = "2.+"
shadow = "8.3.6"

mc = "1.21.1"
parchment = "2024.11.17"
fl = "0.18.6"
fapi = "0.116.10+1.21.1"
nf = "21.1.215"
jsr305 = "3.0.2"
mixinextras = "0.5.0"
mm = "11.0.4"
sodium-fabric = "mc1.21.1-0.6.13-fabric"
sodium-neoforge = "mc1.21.1-0.6.13-neoforge"
axiom = "jTdCyf2H"
# these have to be manually extracted from the jar and put in the flatDir libs folder (only if the enable_axiom property is true)
axiom-axiomclientapi = "1.0.0"
axiom-lattice = "1.2.12"
axiom-mixinconstraints = "1.0.9"

[plugins]
arch = { id = "architectury-plugin", version.ref = "arch" }
loom = { id = "dev.architectury.loom", version.ref = "loom" }
minotaur = { id = "com.modrinth.minotaur", version.ref = "minotaur" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
mc = { group = "mojang", name = "minecraft", version.ref = "mc" }
parchment = { group = "org.parchmentmc.data", name = "parchment-1.21.1", version.ref = "parchment" }

fl = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fl" }
fapi = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fapi" }

nf = { group = "net.neoforged", name = "neoforge", version.ref = "nf" }

jsr305 = { group = "com.google.code.findbugs", name = "jsr305", version.ref = "jsr305" }

mixinextras-common = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixinextras" }
mixinextras-fabric = { group = "io.github.llamalad7", name = "mixinextras-fabric", version.ref = "mixinextras" }
mixinextras-neoforge = { group = "io.github.llamalad7", name = "mixinextras-neoforge", version.ref = "mixinextras" }

mm = { group = "com.terraformersmc", name = "modmenu", version.ref = "mm" }

sodium-fabric = { group = "maven.modrinth", name = "sodium", version.ref = "sodium-fabric" }
sodium-neoforge = { group = "maven.modrinth", name = "sodium", version.ref = "sodium-neoforge" }

axiom = { group = "maven.modrinth", name = "axiom", version.ref = "axiom" }
axiom-axiomclientapi = { group = "local", name = "axiomclientapi", version.ref = "axiom-axiomclientapi" }
axiom-lattice = { group = "local", name = "lattice", version.ref = "axiom-lattice" }
axiom-mixinconstraints = { group = "local", name = "mixinconstraints", version.ref = "axiom-mixinconstraints" }
